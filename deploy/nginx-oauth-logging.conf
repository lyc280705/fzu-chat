# Include in nginx's http context; use the named format in the site's servers:
# access_log /var/log/nginx/fzu-chat.access.log fzu_privacy;
# Keep path/status/timing for operations, but never record query codes or referrers.
log_format fzu_privacy '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"-" "$http_user_agent" rt=$request_time';
