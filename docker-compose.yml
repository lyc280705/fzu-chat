
services:
  fzu-chat:
    build: .
    container_name: fzu-chat
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      FZU_CHAT_ENABLE_LANGSMITH_TRACING: "true"
      FZU_CHAT_CHECKPOINT_PATH: /app/app/storage/conversation_history.sqlite
      FZU_CHAT_REDIS_URL: redis://:${REDIS_PASSWORD:-fzu-chat-dev-redis}@redis:6379/0
      FZU_CHAT_PUBLIC_DOCS: "false"
      FZU_CHAT_STATIC_FALLBACK: strict
      FZU_CHAT_GLOBAL_STREAM_LIMIT: ${FZU_CHAT_GLOBAL_STREAM_LIMIT:-80}
      FZU_CHAT_USER_STREAM_LIMIT: ${FZU_CHAT_USER_STREAM_LIMIT:-5}
      FZU_CHAT_EDU_LOGIN_CONCURRENCY: ${FZU_CHAT_EDU_LOGIN_CONCURRENCY:-8}
      FZU_CHAT_METRICS_ENABLED: "true"
      AMAP_WEB_SERVICE_KEY: ${AMAP_WEB_SERVICE_KEY:-}
      FZU_CHAT_OAUTH_PROVIDERS: ${FZU_CHAT_OAUTH_PROVIDERS:-}
      FZU_CHAT_WECHAT_CLIENT_ID: ${FZU_CHAT_WECHAT_CLIENT_ID:-}
      FZU_CHAT_WECHAT_CLIENT_SECRET: ${FZU_CHAT_WECHAT_CLIENT_SECRET:-}
      FZU_CHAT_WECHAT_REDIRECT_URI: ${FZU_CHAT_WECHAT_REDIRECT_URI:-}
      FZU_CHAT_QQ_CLIENT_ID: ${FZU_CHAT_QQ_CLIENT_ID:-}
      FZU_CHAT_QQ_CLIENT_SECRET: ${FZU_CHAT_QQ_CLIENT_SECRET:-}
      FZU_CHAT_QQ_REDIRECT_URI: ${FZU_CHAT_QQ_REDIRECT_URI:-}
      FZU_CHAT_MICROSOFT_CLIENT_ID: ${FZU_CHAT_MICROSOFT_CLIENT_ID:-}
      FZU_CHAT_MICROSOFT_CLIENT_SECRET: ${FZU_CHAT_MICROSOFT_CLIENT_SECRET:-}
      FZU_CHAT_MICROSOFT_REDIRECT_URI: ${FZU_CHAT_MICROSOFT_REDIRECT_URI:-}
      FZU_CHAT_MICROSOFT_TENANT: ${FZU_CHAT_MICROSOFT_TENANT:-}
      FZU_CHAT_APPLE_CLIENT_ID: ${FZU_CHAT_APPLE_CLIENT_ID:-}
      FZU_CHAT_APPLE_CLIENT_SECRET: ${FZU_CHAT_APPLE_CLIENT_SECRET:-}
      FZU_CHAT_APPLE_REDIRECT_URI: ${FZU_CHAT_APPLE_REDIRECT_URI:-}
      FZU_CHAT_GITHUB_CLIENT_ID: ${FZU_CHAT_GITHUB_CLIENT_ID:-}
      FZU_CHAT_GITHUB_CLIENT_SECRET: ${FZU_CHAT_GITHUB_CLIENT_SECRET:-}
      FZU_CHAT_GITHUB_REDIRECT_URI: ${FZU_CHAT_GITHUB_REDIRECT_URI:-}
    ports:
      - "80:8000"
    volumes:
      - ./app/data:/app/app/data:ro
      - ./app/faiss:/app/app/faiss:ro
      - ./app/png:/app/app/png:ro
      - ./app/storage:/app/app/storage
    security_opt:
      - no-new-privileges:true
    secrets:
      - dashscope_api_key
      - bocha_api_key
      - langsmith_api_key
      - huaweicloud_maas_api_key
      - amap_web_service_key
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    mem_limit: 5g
    cpus: 3

  redis:
    image: redis:7-alpine
    container_name: fzu-chat-redis
    restart: always
    command:
      - sh
      - -c
      - redis-server --save "" --appendonly no --requirepass "$${REDIS_PASSWORD:-fzu-chat-dev-redis}"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-fzu-chat-dev-redis}
    expose:
      - "6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD:-fzu-chat-dev-redis}\" ping | grep PONG"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    mem_limit: 512m
    cpus: 1
secrets:
  dashscope_api_key:
    file: ./dashscope_api_key.txt
  bocha_api_key:
    file: ./bocha_api_key.txt
  langsmith_api_key:
    file: ./langsmith_api_key.txt
  huaweicloud_maas_api_key:
    file: ./huaweicloud_maas_api_key.txt
  amap_web_service_key:
    file: ./amap_web_service_key.txt
